name: Deploy PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Shared with pages-deploy.yml — see the comment there. This group is
# deliberately not per-ref: the contention is over the single gh-pages ref,
# so every writer to it has to queue behind the same lock.
concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy or remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: .
