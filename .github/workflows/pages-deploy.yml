name: Deploy production site to gh-pages

on:
  push:
    branches: [main]

# Only serialise this workflow against itself. A group shared with
# pages-preview.yml looked like the fix for the gh-pages ref-lock race but is
# worse: on a merge both workflows enter the group at once, and GitHub cancels
# a *pending* run when a newer one joins — regardless of cancel-in-progress —
# so the production deploy was silently cancelled instead of loudly failing.
# The race itself is handled by force: false on the deploy step below.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy main to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          target-folder: .
          clean: true
          # gh-pages carries two independent deployments: this one at the root
          # and pr-preview/* from pages-preview.yml. force-push therefore loses
          # the ref-lock race whenever both run together. force: false makes the
          # action rebase onto whatever landed first and retry (attempt-limit,
          # default 3) instead of being rejected.
          force: false
          # Don't let the production deploy wipe out active PR preview
          # subdirectories deployed by pages-preview.yml.
          clean-exclude: |
            pr-preview
